spring.application.name=tutoria-worker
spring.main.web-application-type=none

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# IA local via Ollama (etapa 4). O embedding continua desligado.
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}

# O retry fica a cargo do TutorIA. Sem isto, o Spring AI também refaz as chamadas
# por conta própria e as tentativas se multiplicam.
spring.ai.retry.max-attempts=1
spring.ai.retry.on-http-codes=429
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=${OLLAMA_READ_TIMEOUT:90s}

tutoria.ia.max-tentativas=3
tutoria.ia.intervalo-inicial=2s

# Uma pergunta por vez; mensagens inválidas não são reenfileiradas pelo listener.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false