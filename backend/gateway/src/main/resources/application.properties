spring.application.name=tutoria-gateway
server.port=8081

# RabbitMQ local (compose.yaml ou instalação nativa). Os valores após ":" são os padrões;
# para outro servidor, defina as variáveis de ambiente no terminal antes de iniciar o Gateway.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Falha em poucos segundos se o RabbitMQ estiver desligado, em vez de deixar o navegador esperando.
spring.rabbitmq.connection-timeout=5s
# O Gateway espera o RabbitMQ confirmar cada publicação (veja PerguntaService).
spring.rabbitmq.publisher-confirm-type=simple
